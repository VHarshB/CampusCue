<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CampusCue GPS consent</title><style>body{background:#0c1629;color:#eaf2ff;font:16px system-ui;margin:8vh auto;padding:20px;max-width:500px;line-height:1.6}button{background:#86b3ff;color:#091833;padding:15px;border:0;border-radius:12px;font-weight:700}p{color:#bccde8}</style></head><body><h1>Share location just once?</h1><p>This one-time browser permission sends your current coordinates only to the CampusCue prototype so two agents can check approximate proximity. The other student never sees your GPS. No continuous tracking.</p><button id="go">I consent — use my GPS once</button><p id="out"></p><script>document.getElementById('go').onclick=()=>{const t=new URLSearchParams(location.search).get('t');if(!t){document.getElementById('out').textContent='Missing consent link';return;}navigator.geolocation.getCurrentPosition(async p=>{try{const r=await fetch('/api/gps-once',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({linkToken:t,gpsConsent:true,coords:{lat:p.coords.latitude,lon:p.coords.longitude}})});const j=await r.json();document.getElementById('out').textContent=r.ok?'Location shared once. Return to your Discord conversation.':j.error;}catch(e){document.getElementById('out').textContent=e.message;}},e=>{document.getElementById('out').textContent=e.message;},{maximumAge:0,enableHighAccuracy:false,timeout:10000})}</script></body></html>
