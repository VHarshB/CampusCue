<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusCue · Optional location</title><style>body{font:16px system-ui;display:grid;place-items:center;min-height:90vh;background:#101625;color:#f6f7fb}main{max-width:390px;padding:25px}p{color:#c2cbd8;line-height:1.6}button{background:#846cfd;border:0;color:white;padding:14px 20px;border-radius:12px;font-weight:700;cursor:pointer}</style></head><body><main><h1>Location, once.</h1><p>Sharing precise location is optional. It is only used to check distance from other opted-in students. Your coordinates are never shown to another student, and this session expires automatically.</p><button id="share">Share location once</button><p id="status" role="status"></p></main><script>const token=new URLSearchParams(location.search).get('token');const msg=document.querySelector('#status');document.querySelector('#share').addEventListener('click',()=>{if(!token||!/^[a-f0-9]{48}$/.test(token)){msg.textContent='Invalid or expired link.';return;}if(!navigator.geolocation){msg.textContent='Geolocation unavailable.';return;}msg.textContent='Waiting for your browser permission…';navigator.geolocation.getCurrentPosition(async p=>{try{let r=await fetch('/api/gps-once',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({linkToken:token,gpsConsent:true,coords:{lat:p.coords.latitude,lon:p.coords.longitude}})});let x=await r.json();msg.textContent=r.ok?'Location shared once. Return to Cubbie to continue.':x.error;}catch{msg.textContent='Unable to reach the matching agent.';}},()=>msg.textContent='Permission declined. Continue with your general campus area.',{enableHighAccuracy:false,maximumAge:0,timeout:10000});});</script></body></html>
